<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barbie AI · Style Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#b3536a"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rose:#b3536a; --rose-dark:#7a2e42; --rose-lt:#fdf1f0; --rose-lt2:#fbe6e6;
  --gold:#c9a66b; --gold-lt:#faf3e6;
  --cream:#fdf7f3; --white:#ffffff;
  --gray-lt:#f3ece9; --gray:#ddd0cb; --gray-dk:#8a7b76; --ink:#2b2320;
  --radius:10px; --radius-lg:18px;
  --shadow:0 2px 12px rgba(122,46,66,0.10);
  --shadow-lg:0 12px 40px rgba(122,46,66,0.16);
}
html, body { height:100%; }
body {
  font-family:'Poppins', sans-serif; background:var(--cream); color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column;
}

/* ── Header + Tabs: single sticky wrapper so they always stack correctly
     regardless of actual rendered header height (no hardcoded offsets) ── */
.sticky-top { position:sticky; top:0; z-index:20; }
header {
  background:var(--white); border-bottom:1px solid var(--gray-lt);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 1px 4px rgba(0,0,0,0.03);
}
.hdr-brand { display:flex; align-items:center; gap:10px; }
.hdr-badge {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:17px;
}
.hdr-brand h1 { font-family:'Playfair Display', serif; font-size:19px; color:var(--rose-dark); }
.hdr-user { display:flex; align-items:center; gap:10px; }
.hdr-avatar {
  width:34px; height:34px; border-radius:50%; background:var(--rose-lt); color:var(--rose-dark);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;
}
.hdr-name { font-size:13.5px; font-weight:500; color:var(--ink); }
.hdr-logout {
  border:1px solid var(--gray); background:var(--white); border-radius:8px;
  padding:7px 12px; font-size:12.5px; color:var(--gray-dk); cursor:pointer; transition:all .15s;
}
.hdr-logout:hover { border-color:var(--rose); color:var(--rose-dark); }

/* ── Tabs ── */
.tabbar {
  display:flex; gap:4px; padding:8px 16px; background:var(--white);
  border-bottom:1px solid var(--gray-lt); overflow-x:auto;
}
.tab {
  flex-shrink:0; padding:9px 16px; border-radius:20px; font-size:13.5px; font-weight:500;
  color:var(--gray-dk); cursor:pointer; transition:all .15s; white-space:nowrap;
  display:flex; align-items:center; gap:6px; border:1px solid transparent;
}
.tab:hover { background:var(--rose-lt); }
.tab.active { background:var(--rose); color:#fff; }
.tab.soon { opacity:0.55; cursor:default; }
.tab.soon:hover { background:transparent; }
.tab-soon-badge {
  font-size:9px; font-weight:700; background:var(--gold); color:#5c4820;
  padding:1px 6px; border-radius:8px; letter-spacing:0.03em; text-transform:uppercase;
}

/* ── Layout ── */
.wrap { flex:1; display:flex; flex-direction:column; }
.panel { display:none; flex:1; }
.panel.active { display:flex; }
.module-grid {
  display:grid; grid-template-columns:340px 1fr; gap:0; flex:1; width:100%;
}
@media (max-width: 860px) { .module-grid { grid-template-columns:1fr; } }

aside {
  background:var(--white); border-right:1px solid var(--gray-lt);
  padding:20px; display:flex; flex-direction:column; gap:16px;
}
.aside-title { font-family:'Playfair Display', serif; font-size:19px; color:var(--rose-dark); }
.aside-sub { font-size:12.5px; color:var(--gray-dk); line-height:1.5; }

.img-tabs { display:flex; gap:8px; }
.img-tab {
  flex:1; text-align:center; padding:9px; border-radius:8px; font-size:12.5px; font-weight:500;
  background:var(--gray-lt); color:var(--gray-dk); cursor:pointer; border:1.5px solid transparent;
}
.img-tab.active { background:var(--rose-lt); color:var(--rose-dark); border-color:var(--rose); }

.upload-zone {
  border:2px dashed var(--gray); border-radius:var(--radius-lg); padding:28px 16px;
  text-align:center; cursor:pointer; transition:all .15s; background:var(--gray-lt);
}
.upload-zone:hover { border-color:var(--rose); background:var(--rose-lt); }
.upload-zone svg { width:34px; height:34px; stroke:var(--gray-dk); fill:none; stroke-width:1.6; margin-bottom:8px; }
.upload-zone h4 { font-size:13.5px; color:var(--ink); margin-bottom:4px; }
.upload-zone p { font-size:11.5px; color:var(--gray-dk); }

.camera-box { position:relative; border-radius:var(--radius-lg); overflow:hidden; background:#000; aspect-ratio:3/4; }
.camera-box video, .camera-box img { width:100%; height:100%; object-fit:cover; display:none; }
.camera-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; flex-direction:column; gap:10px; }
.camera-placeholder svg { width:40px; height:40px; stroke:#fff; fill:none; stroke-width:1.5; opacity:0.7; }
.cam-btn { padding:9px 18px; background:var(--rose); color:#fff; border:none; border-radius:20px; font-size:12.5px; font-weight:500; cursor:pointer; }
.camera-controls { position:absolute; bottom:14px; left:0; right:0; display:none; justify-content:center; gap:14px; }
.cam-round { width:52px; height:52px; border-radius:50%; background:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cam-flip { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.25); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cam-err { display:none; margin-top:8px; font-size:12px; color:#b91c1c; }

.preview-card { display:flex; align-items:center; gap:10px; background:var(--gray-lt); border-radius:var(--radius); padding:8px; position:relative; }
.preview-card img { width:52px; height:52px; border-radius:8px; object-fit:cover; }
.preview-info { flex:1; min-width:0; }
.preview-info p { font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.preview-info span { font-size:11px; color:var(--rose-dark); }
.rm-btn { background:none; border:none; font-size:18px; color:var(--gray-dk); cursor:pointer; padding:4px 8px; }

.prompt-accordion { display:none; }
.prompt-summary { font-size:11.5px; color:var(--gray-dk); cursor:pointer; padding:8px 0; user-select:none; }
.prompt-text { font-size:10.5px; color:var(--gray-dk); background:var(--gray-lt); border-radius:8px; padding:10px; max-height:120px; overflow-y:auto; white-space:pre-wrap; line-height:1.5; margin-top:6px; display:none; }

.gen-btn {
  width:100%; height:46px; border:none; border-radius:var(--radius);
  background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; transition:opacity .15s;
  display:flex; align-items:center; justify-content:center; gap:8px; margin-top:auto;
}
.gen-btn:hover { opacity:0.9; }
.gen-btn:disabled { opacity:0.4; cursor:not-allowed; }
.spinner { width:15px; height:15px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

main.output { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 20px; gap:16px; overflow-y:auto; }
.empty-state { text-align:center; max-width:340px; }
.empty-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; width:150px; margin:0 auto 18px; }
.eg-cell { aspect-ratio:1; background:var(--rose-lt); border-radius:4px; }
.empty-state h3 { font-family:'Playfair Display', serif; font-size:19px; color:var(--rose-dark); margin-bottom:6px; }
.empty-state p { font-size:13px; color:var(--gray-dk); line-height:1.6; }

.status-bar { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:var(--radius); font-size:13px; }
.status-bar.info { background:var(--rose-lt); color:var(--rose-dark); }
.status-bar.success { background:#f0fdf4; color:#166534; }
.status-bar.error { background:#fef2f2; color:#991b1b; }
.spin2 { width:15px; height:15px; border:2px solid rgba(122,46,66,0.25); border-top-color:var(--rose-dark); border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }

.result-wrap { width:100%; max-width:640px; display:flex; flex-direction:column; gap:12px; }
.result-label { font-family:'Playfair Display', serif; font-size:18px; color:var(--rose-dark); text-align:center; }
.result-img-box { border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lg); background:#fff; }
.result-img-box img { width:100%; display:block; }
.result-actions { display:flex; gap:10px; }
.result-actions button {
  flex:1; height:42px; border-radius:var(--radius); font-size:13px; font-weight:500; cursor:pointer; border:1.5px solid var(--gray);
  background:var(--white); color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px;
}
.result-actions button.primary { background:var(--rose); border-color:var(--rose); color:#fff; }

/* ── Reports panel ── */
.reports-wrap { max-width:900px; margin:0 auto; padding:24px 20px; width:100%; }
.reports-wrap h2 { font-family:'Playfair Display', serif; font-size:22px; color:var(--rose-dark); margin-bottom:16px; }
.report-row { display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--gray-lt); border-radius:var(--radius); padding:12px; margin-bottom:8px; }
.report-row img { width:48px; height:48px; border-radius:8px; object-fit:cover; }
.report-row .r-info { flex:1; }
.report-row .r-module { font-size:13px; font-weight:600; color:var(--rose-dark); text-transform:capitalize; }
.report-row .r-date { font-size:11.5px; color:var(--gray-dk); }

@media (max-width: 640px) {
  .hdr-name { display:none; }
}
</style>
</head>
<body>

<div class="sticky-top">
  <header>
    <div class="hdr-brand">
      <div class="hdr-badge">💄</div>
      <h1>Barbie AI</h1>
    </div>
    <div class="hdr-user">

    <div class="tab" id="tab-haircolour" onclick="switchModule('haircolour')">🎨 Hair Colour</div>
    <div class="tab" id="tab-saree" onclick="switchModule('saree')">🥻 Saree</div>
    <div class="tab" id="tab-chudidar" onclick="switchModule('chudidar')">👗 Chudidar</div>

</div>

<div class="wrap" id="modulesRoot"></div>

<canvas id="snapCanvas" style="display:none;"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const avatarEl = document.getElementById('userAvatar');
if (session.name) {

  localStorage.removeItem('barbie_auth');

    emptyDesc: 'Upload a clear full-body photo and generate a 16-look personal dress style & outfit consultation grid, spanning ethnic and Western styles.',
  },
];

// Per-module runtime state
const state = {};
MODULES.forEach(m => state[m.id] = {
  imageBase64: null, imageMime: null, lastDataUrl: null, stream: null, facingMode: 'user'
});

const _geminiCalls = { hairstyle: 0, haircolour: 0, saree: 0, chudidar: 0 };

// ── SVG icon snippets ──
const ICON_UPLOAD = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
const ICON_CAMERA = '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICON_DOWNLOAD = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
const ICON_SHARE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';

// ── Render each module panel into #modulesRoot ────────────────
const root = document.getElementById('modulesRoot');
MODULES.forEach(m => {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + m.id;
  panel.innerHTML = `
    <div class="module-grid">
      <aside>
        <div>
          <div class="aside-title">${m.emoji} ${m.label}</div>
          <div class="aside-sub">${m.photoHint}</div>
        </div>

        <div class="img-tabs">
          <div class="img-tab active" id="${m.id}-tab-upload" onclick="switchImgTab('${m.id}','upload')">Upload Photo</div>
          <div class="img-tab" id="${m.id}-tab-camera" onclick="switchImgTab('${m.id}','camera')">Use Camera</div>
        </div>

        <div id="${m.id}-uploadPanel">
          <div class="upload-zone" onclick="document.getElementById('${m.id}-fileInput').click()">
            ${ICON_UPLOAD}
            <h4>Drop or click to upload</h4>
            <p>${m.photoHint}</p>
          </div>
          <input type="file" id="${m.id}-fileInput" accept="image/*" style="display:none" onchange="handleFile('${m.id}', event)"/>
        </div>

        <div id="${m.id}-cameraPanel" style="display:none;">
          <div class="camera-box">
            <video id="${m.id}-cameraFeed" autoplay playsinline></video>
            <img id="${m.id}-snapPreview" alt="snapshot preview"/>
            <div class="camera-placeholder" id="${m.id}-cameraPlaceholder">
              ${ICON_CAMERA}
              <button class="cam-btn" onclick="startCamera('${m.id}')">Enable Camera</button>
            </div>
            <div class="camera-controls" id="${m.id}-cameraControls">
              <button class="cam-flip" onclick="flipCamera('${m.id}')">⟲</button>
              <button class="cam-round" onclick="snapPhoto('${m.id}')"></button>
            </div>
          </div>
          <div class="cam-err" id="${m.id}-cameraError"></div>
        </div>

        <div id="${m.id}-previewSection" style="display:none;"></div>

        <div class="prompt-accordion" id="${m.id}-promptAccordion">
          <div class="prompt-summary" onclick="togglePrompt('${m.id}')">▸ View AI consultation prompt</div>
          <div class="prompt-text" id="${m.id}-promptText"></div>
        </div>

        <button class="gen-btn" id="${m.id}-genBtn" onclick="generate('${m.id}')" disabled>
          <span id="${m.id}-genBtnLabel">Generate My ${m.label} Grid</span>
        </button>
      </aside>

      <main class="output">
        <div class="empty-state" id="${m.id}-emptyState">
          <div class="empty-grid">
            <div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div>
            <div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div>
            <div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div>
            <div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div><div class="eg-cell"></div>
          </div>
          <h3>${m.emptyTitle}</h3>
          <p>${m.emptyDesc}</p>
        </div>
        <div id="${m.id}-statusArea" style="display:none; width:100%; max-width:560px;"></div>
        <div id="${m.id}-resultArea" style="display:none;"></div>
      </main>
    </div>
  `;
  root.appendChild(panel);
});

// Reports panel
const reportsPanel = document.createElement('div');
reportsPanel.className = 'panel';
reportsPanel.id = 'panel-reports';
reportsPanel.innerHTML = `
  <div class="reports-wrap">
    <h2>My Saved Looks</h2>
    <div id="reportsList"><p style="color:var(--gray-dk); font-size:13px;">Loading…</p></div>
  </div>
`;
root.appendChild(reportsPanel);

document.getElementById('panel-hairstyle').classList.add('active');

// ── Module tab switching ──
const ALL_MODULE_IDS = MODULES.map(m => m.id).concat(['reports']);
function switchModule(id) {
  ALL_MODULE_IDS.forEach(mid => {
    const tabEl = document.getElementById('tab-' + mid);
    if (tabEl) tabEl.classList.toggle('active', mid === id);
    document.getElementById('panel-' + mid).classList.toggle('active', mid === id);
  });
  if (id === 'reports') loadMyReports();
}

// ── Image tab (upload vs camera) switching ──
function switchImgTab(moduleId, tab) {
  const isCamera = tab === 'camera';
  document.getElementById(moduleId + '-tab-camera').className = 'img-tab' + (isCamera ? ' active' : '');
  document.getElementById(moduleId + '-tab-upload').className = 'img-tab' + (!isCamera ? ' active' : '');
  document.getElementById(moduleId + '-cameraPanel').style.display = isCamera ? 'block' : 'none';
  document.getElementById(moduleId + '-uploadPanel').style.display = isCamera ? 'none' : 'block';
  if (!isCamera) stopCamera(moduleId);
}

// ── Camera handling ──
async function startCamera(moduleId) {
  const s = state[moduleId];
  const errEl = document.getElementById(moduleId + '-cameraError');
  errEl.style.display = 'none';
  try {
    s.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: s.facingMode, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
    });
    const video = document.getElementById(moduleId + '-cameraFeed');
    video.srcObject = s.stream;
    video.style.display = 'block';
    document.getElementById(moduleId + '-cameraPlaceholder').style.display = 'none';
    document.getElementById(moduleId + '-cameraControls').style.display = 'flex';
  } catch (err) {
    errEl.style.display = 'block';
    errEl.textContent = err.name === 'NotAllowedError'
      ? '⚠ Camera access denied. Please allow camera permission and try again.'
      : '⚠ Could not access camera: ' + err.message;
  }
}

function stopCamera(moduleId) {
  const s = state[moduleId];
  if (s.stream) { s.stream.getTracks().forEach(t => t.stop()); s.stream = null; }
  const video = document.getElementById(moduleId + '-cameraFeed');
  video.srcObject = null;
  video.style.display = 'none';
  document.getElementById(moduleId + '-cameraPlaceholder').style.display = 'flex';
  document.getElementById(moduleId + '-cameraControls').style.display = 'none';
}

async function flipCamera(moduleId) {
  const s = state[moduleId];
  s.facingMode = s.facingMode === 'user' ? 'environment' : 'user';
  stopCamera(moduleId); await startCamera(moduleId);
}

function snapPhoto(moduleId) {
  const video = document.getElementById(moduleId + '-cameraFeed');
  const canvas = document.getElementById('snapCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  state[moduleId].imageBase64 = dataUrl.split(',')[1];
  state[moduleId].imageMime = 'image/jpeg';
  stopCamera(moduleId);
  showPreview(moduleId, dataUrl, 'Camera Snapshot');
}

// ── File upload ──
function handleFile(moduleId, e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('File too large — max 10MB.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    state[moduleId].imageBase64 = dataUrl.split(',')[1];
    state[moduleId].imageMime = file.type || 'image/jpeg';
    showPreview(moduleId, dataUrl, file.name);
  };
  reader.readAsDataURL(file);
}

function showPreview(moduleId, dataUrl, name) {
  const sec = document.getElementById(moduleId + '-previewSection');
  sec.style.display = 'block';
  sec.innerHTML = `<div class="preview-card">
    <img src="${dataUrl}" alt="preview"/>
    <div class="preview-info"><p>${name}</p><span>✓ Ready to generate</span></div>
    <button class="rm-btn" onclick="removeImage('${moduleId}')">×</button>
  </div>`;
  document.getElementById(moduleId + '-promptText').textContent = PROMPTS[moduleId];
  document.getElementById(moduleId + '-promptAccordion').style.display = 'block';
  checkReady(moduleId);
}

function togglePrompt(moduleId) {
  const el = document.getElementById(moduleId + '-promptText');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function removeImage(moduleId) {
  state[moduleId].imageBase64 = null; state[moduleId].imageMime = null;
  document.getElementById(moduleId + '-previewSection').style.display = 'none';
  document.getElementById(moduleId + '-fileInput').value = '';
  document.getElementById(moduleId + '-promptAccordion').style.display = 'none';
  resetOutput(moduleId); checkReady(moduleId);
}

function checkReady(moduleId) {
  document.getElementById(moduleId + '-genBtn').disabled = !state[moduleId].imageBase64;
}

function resetOutput(moduleId) {
  document.getElementById(moduleId + '-emptyState').style.display = 'block';
  document.getElementById(moduleId + '-statusArea').style.display = 'none';
  document.getElementById(moduleId + '-resultArea').style.display = 'none';
}

function showStatus(moduleId, type, msg, spinner) {
  document.getElementById(moduleId + '-emptyState').style.display = 'none';
  const sa = document.getElementById(moduleId + '-statusArea');
  sa.style.display = 'block';
  sa.innerHTML = `<div class="status-bar ${type}">${spinner ? '<div class="spin2"></div>' : ''}<span>${msg}</span></div>`;
}

// ── Generate ──
async function generate(moduleId) {
  const s = state[moduleId];
  const mod = MODULES.find(m => m.id === moduleId);
  if (!s.imageBase64) return;

  const btn = document.getElementById(moduleId + '-genBtn');
  const label = document.getElementById(moduleId + '-genBtnLabel');
  btn.disabled = true;
  label.innerHTML = '<div class="spinner"></div> Generating…';
  document.getElementById(moduleId + '-resultArea').style.display = 'none';
  showStatus(moduleId, 'info', 'Preparing your photo…', true);

  // Resize to max 1024px (full-body modules need more detail than face-only)
  let finalBase64 = s.imageBase64;
  let finalMime   = s.imageMime;
  try {
    const img = new Image();
    await new Promise(res => { img.onload = res; img.src = `data:${s.imageMime};base64,${s.imageBase64}`; });
    const MAX = 1024;
    if (img.width > MAX || img.height > MAX) {
      const scale = Math.min(MAX / img.width, MAX / img.height);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.9);
      finalBase64 = dataUrl.split(',')[1]; finalMime = 'image/jpeg';
    }
  } catch (e) { /* use original if resize fails */ }

  // Note: background is intentionally NOT removed — these prompts require
  // preserving the original background exactly across all 16 grid cells.
  showStatus(moduleId, 'info', mod.loadingLabel, true);

  try {
    const payload = {
      contents: [{
        parts: [
          { text: PROMPTS[moduleId] },
          { inline_data: { mime_type: finalMime, data: finalBase64 } }
        ]
      }],
      generationConfig: { responseModalities: ['IMAGE', 'TEXT'], temperature: 0.4 }
    };

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 120000);

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payload }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || data?.error || 'Error ' + res.status);

    const parts = data?.candidates?.[0]?.content?.parts || [];
    const imgPart = parts.find(p => p.inlineData?.mimeType?.startsWith('image/'));

    if (!imgPart) {
      const txt = parts.find(p => p.text);
      throw new Error(txt?.text?.slice(0, 220) || 'No image returned. Try a clearer photo.');
    }

    s.lastDataUrl = `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
    showStatus(moduleId, 'success', mod.successLabel, false);
    _geminiCalls[moduleId] = (_geminiCalls[moduleId] || 0) + 1;

    const ra = document.getElementById(moduleId + '-resultArea');
    ra.style.display = 'block';
    const outputEl = ra.closest('.output');
    if (outputEl) outputEl.scrollTop = 0;
    ra.innerHTML = `<div class="result-wrap">
      <div class="result-label">${mod.resultLabel}</div>
      <div class="result-img-box"><img src="${s.lastDataUrl}" alt="16-look consultation grid"/></div>
      <div class="result-actions">
        <button onclick="downloadResult('${moduleId}')">${ICON_DOWNLOAD} Download</button>
        <button class="primary" onclick="shareResult('${moduleId}')">${ICON_SHARE} Share</button>
      </div>
    </div>`;

    saveReport(moduleId, s.lastDataUrl).catch(() => {});

  } catch (err) {
    showStatus(moduleId, 'error', '⚠ ' + err.message, false);
  } finally {
    btn.disabled = false;
    label.textContent = 'Generate My ' + mod.label + ' Grid';
  }
}

function downloadResult(moduleId) {
  const s = state[moduleId];
  if (!s.lastDataUrl) return;
  const a = document.createElement('a');
  a.href = s.lastDataUrl;
  a.download = `barbie-${moduleId}-grid-${Date.now()}.png`;
  a.click();
}

async function shareResult(moduleId) {
  const s = state[moduleId];
  if (!s.lastDataUrl) return;
  try {
    const res = await fetch(s.lastDataUrl);
    const blob = await res.blob();
    const file = new File([blob], `barbie-${moduleId}-grid.png`, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'My Barbie AI Style Grid' });
    } else {
      downloadResult(moduleId);
    }
  } catch (e) { downloadResult(moduleId); }
}

// ── Save report to Supabase (best-effort, non-blocking) ──
async function saveReport(moduleId, dataUrl) {
  const sb = getSb();
  if (!sb) return;
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const path = `${moduleId}/${session.id || 'anon'}-${Date.now()}.png`;
    const { error: upErr } = await sb.storage.from(GRID_BUCKET).upload(path, blob, { contentType: 'image/png', upsert: true });
    if (upErr) return;
    const { data: pub } = sb.storage.from(GRID_BUCKET).getPublicUrl(path);
    await sb.from('barbie_grid_reports').insert({
      user_id: session.id || null,
      user_name: session.name || null,
      module: moduleId,
      image_url: pub?.publicUrl || null,
      created_at: new Date().toISOString()
    });
  } catch (e) { /* best-effort */ }
}

// ── My Reports ──
async function loadMyReports() {
  const listEl = document.getElementById('reportsList');
  const sb = getSb();
  if (!sb) { listEl.innerHTML = '<p style="color:var(--gray-dk); font-size:13px;">Reports unavailable.</p>'; return; }
  try {
    const { data, error } = await sb.from('barbie_grid_reports')
      .select('module, image_url, created_at')
      .eq('user_id', session.id)
      .order('created_at', { ascending: false })
      .limit(50);
    if (error || !data || data.length === 0) {
      listEl.innerHTML = '<p style="color:var(--gray-dk); font-size:13px;">No saved looks yet — generate your first style grid!</p>';
      return;
    }
    listEl.innerHTML = data.map(r => `
      <div class="report-row">
        <img src="${r.image_url}" alt="${r.module}"/>
        <div class="r-info">
          <div class="r-module">${r.module}</div>
          <div class="r-date">${new Date(r.created_at).toLocaleString()}</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = '<p style="color:var(--gray-dk); font-size:13px;">Could not load reports.</p>';
  }
}
</script>
