<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barbie AI · My Style Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rose:#b3536a; --rose-dark:#7a2e42; --rose-lt:#fdf1f0;
  --gold:#c9a66b; --cream:#fdf7f3; --gray-dk:#8a7b76;
}
body {
  font-family:'Poppins', sans-serif; background:var(--cream);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding: 24px 16px;
}
.brand { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
.brand-badge {
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.brand h1 { font-family:'Playfair Display', serif; font-size:18px; color:var(--rose-dark); }

.card {
  background:#fff; border-radius:18px; max-width:600px; width:100%;
  box-shadow:0 12px 40px rgba(122,46,66,0.16); overflow:hidden;
}
.card img { width:100%; display:block; background:var(--rose-lt); min-height:200px; }
.card-body { padding:18px 20px; text-align:center; }
.card-body h2 { font-family:'Playfair Display', serif; font-size:18px; color:var(--rose-dark); margin-bottom:6px; text-transform:capitalize; }
.card-body p { font-size:12.5px; color:var(--gray-dk); margin-bottom:16px; }

.cta {
  display:inline-block; background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  color:#fff; text-decoration:none; padding:11px 26px; border-radius:24px;
  font-size:13.5px; font-weight:600;
}

.loading, .error { padding:60px 20px; text-align:center; color:var(--gray-dk); font-size:13.5px; }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-badge">💄</div>
  <h1>Barbie AI</h1>
</div>

<div class="card" id="card">
  <div class="loading">Loading your style grid…</div>
</div>

<script>
const SUPABASE_URL      = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const GRID_BUCKET_GV    = 'barbie-grid-shares';

const params = new URLSearchParams(window.location.search);
const gridType = params.get('type') || 'hairstyle';
const token    = params.get('id');
const ext      = params.get('ext') || 'png';

const MODULE_LABELS = {
  hairstyle: 'Hairstyle Consultation',
  haircolour: 'Hair Colour Consultation',
  saree: 'Saree Style Consultation',
  chudidar: 'Chudidar Style Consultation',
};

async function loadGrid() {
  const card = document.getElementById('card');
  if (!token) {
    card.innerHTML = '<div class="error">This link is missing an image reference.</div>';
    return;
  }
  const imgUrl = `${SUPABASE_URL}/storage/v1/object/public/${GRID_BUCKET_GV}/${gridType}/${token}.${ext}`;

  card.innerHTML = `
    <img src="${imgUrl}" alt="${gridType} grid" onerror="this.parentElement.querySelector('.card-body').insertAdjacentHTML('afterbegin', '<p style=color:%23b91c1c>Image could not be loaded.</p>')"/>
    <div class="card-body">
      <h2>${MODULE_LABELS[gridType] || 'Style Consultation'}</h2>
      <p>Generated by Barbie AI — personalized style consultation.</p>
      <a class="cta" href="/">Try Barbie AI →</a>
    </div>
  `;
}

loadGrid();
</script>
</body>
</html>
